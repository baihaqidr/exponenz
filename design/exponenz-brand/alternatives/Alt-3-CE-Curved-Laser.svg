<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF6F1; }
      .replit-dark { fill: #181818; }
      .laser-glow { fill: url(#laserGradient); }
    </style>
    <linearGradient id="laserGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3C00" stop-opacity="0.2"/>
      <stop offset="35%" stop-color="#FF3C00"/>
      <stop offset="55%" stop-color="#FFA800"/>
      <stop offset="75%" stop-color="#FF3C00"/>
      <stop offset="100%" stop-color="#FF3C00" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="512" height="512" rx="48" class="bg"/>
  
  <!-- Alt 3: Curved "C" Crescent Base + Integrated Laser Crossbar forming "E" -->
  <g transform="translate(116, 106)">
    <!-- Base "C" Crescent Geometry -->
    <path class="replit-dark" d="
      M 220,0 
      C 100,0 12,90 12,150 
      C 12,210 100,300 220,300 
      C 255,300 270,285 270,265 
      C 270,245 250,240 220,240 
      C 135,240 76,190 76,150 
      C 76,110 135,60 220,60 
      C 250,60 270,55 270,35 
      C 270,15 255,0 220,0 
      Z
    "/>
    
    <!-- Central Laser E-Bar Slicing the "C" into an "E" -->
    <path class="laser-glow" d="
      M -20,150 
      L 130,138 
      L 290,146 
      L 310,150 
      L 290,154 
      L 130,162 
      Z
    "/>
    
    <!-- Solid Orange Center Core Pulse -->
    <rect x="52" y="136" width="138" height="28" rx="14" fill="#FF3C00"/>
    <circle cx="120" cy="150" r="8" fill="#FFF5EA"/>
  </g>
</svg>
