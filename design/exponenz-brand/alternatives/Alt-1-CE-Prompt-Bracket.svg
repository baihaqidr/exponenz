<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #FAF6F1; }
      .replit-orange { fill: #FF3C00; }
      .replit-dark { fill: #181818; }
    </style>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="512" height="512" rx="48" class="bg"/>
  
  <!-- Alt 1: Outer Replit "C" Bracket with Floating Core Bar (Forms "C + E") -->
  <g transform="translate(106, 116)">
    <!-- Outer "C" Modular Bracket (Replit Dark / Solid #181818) -->
    <path class="replit-dark" d="
      M 32,0 
      H 260 
      C 277.673,0 292,14.327 292,32 
      C 292,49.673 277.673,64 260,64 
      H 84 
      C 72.954,64 64,72.954 64,84 
      V 196 
      C 64,207.046 72.954,216 84,216 
      H 260 
      C 277.673,216 292,230.327 292,248 
      C 292,265.673 277.673,280 260,280 
      H 32 
      C 14.327,280 0,265.673 0,248 
      V 32 
      C 0,14.327 14.327,0 32,0 
      Z
    "/>
    
    <!-- Inner Core Floating Modular Bar (Replit Orange #FF3C00) completing the "E" -->
    <rect x="76" y="108" width="174" height="64" rx="32" class="replit-orange"/>
    
    <!-- Code prompt accent spark in the center -->
    <circle cx="108" cy="140" r="10" fill="#FAF6F1"/>
  </g>
</svg>
